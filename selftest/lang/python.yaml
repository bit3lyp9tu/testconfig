config:
    script_execution:
       file_path: "$file_path"
       command: "env/bin/python3 $file_path"
    variable_infix_char: "%"
    variables:
        import_module: "%module%"
        function_name: "%function_name%"
        function_index: "%function_index%"
        parameters: "%parameters%"
        expected_result: "%expected_result%"
        calculated_result: "%calculated_result%"
        file_path: "%file_path%"
        module_name: "%module_name%"
        custom_test_case: "%custom_test_case%"
        generic_hash: "%generic_hash%"
unit-test:
    syntax_scheme:
        header_data:
            - "import sys"
            - 'from pathlib import Path'
            - 'import importlib.util'
            - ''
            - 'ROOT = Path(__file__).resolve().parents[1]'
            - 'sys.path.insert(0, str(ROOT))'
        import_head:
            - 'spec = importlib.util.spec_from_file_location("%module_name%", ROOT / "%file_path%")'
            - '%module_name% = importlib.util.module_from_spec(spec) # type: ignore'
            - 'spec.loader.exec_module(%module_name%) # type: ignore'
        single_test_code:
            - is_equal_test:
                scheme: ''
            - is_unequal_test:
                scheme: 'def test_function_%generic_hash%():'
        if_success:
            run:
                exit_code: 0
        if_failure:
            run:
                messages:
                    default_case:
                        - "\tassert %function_name%(%parameters%) == %expected_result%"
                        # - "\tprint('[FAIL] %file_path%#%function_name%(%parameters%) != %expected_result%')"
                        # - "\tsys.exit(1)"
                    custom_case:
                        - "\tassert %custom_test_case%"
                exit_code: 1
hooks:
    general_setup:
      attributes:
            - 'file_path'
            - 'requirements_path'
      commands:
            - 'echo "General Setup"'
            - 'python -m venv venv'
            - 'source venv/bin/activate'
            - 'pip install -r $requirements_path >/dev/null 2>&1'
    general_shutdown:
        commands:
            # - 'rm $file_path/*'
            - 'echo Teardown env'
    file_setup:
    file_shutdown:
    function_setup:
    function_shutdown:
