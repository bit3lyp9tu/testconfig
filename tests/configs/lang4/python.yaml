config:
    script_execution:
       file_path: "$file_path"
       command: "env/bin/python3 $file_path"
    variable_infix_char: "%"
    variables:
        import_module: "%module%"
        function_name: "%function_name%"
        parameters: "%parameters%"
        expected_result: "%expected_result%"
        calculated_result: "%calculated_result%"
        file_path: "%file_path%"
        module_name: "%module_name%"
        custom_test_case: "%custom_test_case%"
unit-test:
    syntax_scheme:
        header_data:
            - "import sys"
            - 'from pathlib import Path'
            - 'import importlib.util'
            - ''
            - 'ROOT = Path(__file__).resolve().parents[1]'
            - 'sys.path.insert(0, str(ROOT))'
            - 'module_path = ROOT / "%file_path%"'
            - ''
            - 'spec = importlib.util.spec_from_file_location("test_module",module_path)'
            - 'test_module = importlib.util.module_from_spec(spec) # type: ignore'
            - 'spec.loader.exec_module(test_module) # type: ignore'
        single_test_code:
            - is_equal_test:
                scheme: 'if test_module.%function_name%(%parameters%) == %expected_result%:'
            - is_unequal_test:
                scheme: 'if test_module.%function_name%(%parameters%) != %expected_result%:'
        if_success:
            run:
                exit_code: 0
        if_failure:
            run:
                messages:
                    default_case:
                        - "\tprint('[FAIL] %file_path%#%function_name%(%parameters%) != %expected_result%')"
                        - "\tsys.exit(1)"
                    custom_case:
                        - "\tprint('[FAIL] %custom_test_case%')"
                exit_code: 1
hooks:
    general_setup:
    general_shutdown:
    file_setup:
    file_shutdown:
    function_setup:
    function_shutdown:
