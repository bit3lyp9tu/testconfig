config:
    script_execution:
       file_path: "$file_path"
       command: "php $file_path"
    variable_infix_char: "%"
    variables:
        import_module: "%module%"
        function_name: "%function_name%"
        function_index: "%function_index%"
        parameters: "%parameters%"
        expected_result: "%expected_result%"
        calculated_result: "%calculated_result%"
        file_path: "%file_path%"
        module_name: "%module_name%"
        custom_test_case: "%custom_test_case%"
        generic_hash: "%generic_hash%"
unit-test:
    syntax_scheme:
        header_data:
          - "<?php"
          - "include '%file_path%';"
        single_test_code:
            is_equal_test:
                scheme: 'if (%function_name%(%parameters%) == %expected_result%) {}'
            is_unequal_test:
                scheme: 'if (%function_name%(%parameters%) != %expected_result%) {throw new Exception("Test Failed");}'
                custom_scheme: 'if %module_name%.%custom_test_case%:'
        if_success:
            run:
                exit_code: 0
        if_failure:
            run:
                messages:
                    messages:
                    default_case:
                    custom_case:
                exit_code: 1
        footer_data:
          - ""
          - "?>"
hooks:
    general_setup:
    general_shutdown:
    file_setup:
        # commands:
        #     - "ls -a invalid_path"
    file_shutdown:
    function_setup:
    function_shutdown:
