config:
    script_execution:
       file_path: "$file_path"
       command: "env/bin/python3 $file_path"
    variable_infix_char: "%"
    variables:
        import_module: "%module%"
        function_name: "%function_name%"
        parameters: "%parameters%"
        expected_result: "%expected_result%"
        calculated_result: "%calculated_result%"
        file_path: "%file_path%"
        module_name: "%module_name%"
unit-test:
    syntax_scheme:
        header_data:
            - "import sys"
            - 'from pathlib import Path'
            - 'import importlib.util'
            - ''
            - 'ROOT = Path(__file__).resolve().parents[1]'
        import_head:
            - 'spec = importlib.util.spec_from_file_location("%module_name%", ROOT / "%file_path%")'
            - '%module_name% = importlib.util.module_from_spec(spec) # type: ignore'
            - 'spec.loader.exec_module(%module_name%) # type: ignore'
        single_test_code:
            - is_equal_test:
                scheme: 'if %module_name%.%function_name%(%parameters%) == %expected_result%:'
            - is_unequal_test:
                scheme: 'if %module_name%.%function_name%(%parameters%) != %expected_result%:'
        if_success:
            run:
                exit_code: 0
        if_failure:
            run:
                messages:
                   - "\tprint('[FAIL] %file_path%#%function_name%(%parameters%) != %expected_result%')"
                   - "\tsys.exit(1)"
                exit_code: 1
hooks:
    general_setup:
        attributes:
            - "env_name"
        commands:
            - "echo Setting up environment"
            # - "echo 'Installing Modules'"
            # - "source $env_name/bin/activate"
            # - "pip install -r src/requirements.txt >/dev/null 2>&1"
        description: "Setup the environment before running the tests"
    general_shutdown:
        attributes:
            - "path_old"
        commands:
            - "echo 'Closing down environment' in $path"
        description: "Close down the environment after running the tests"
    file_setup:
        attributes:
            path: "this_path_gets_overridden"
        commands:
           - "echo OVERRIDDEN"
    file_shutdown:
    function_setup:
        attributes:
            - "path"
            - "target"
    function_shutdown:
        description: "none"
